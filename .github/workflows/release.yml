name: Release

run-name: Release (${{ inputs.bump }} bump)

# Manual release workflow. Mirrors the steps in prepare_release.sh, plus a
# version bump beforehand:
#   1. Bump package.json's version (patch by default, or minor).
#   2. Commit ("chore: bump to X.Y.Z") and push to main.
#   3. Build (pnpm install), which regenerates src/version.h from the
#      bumped package.json version + the just-pushed commit.
#   4. Verify src/version.h matches, exactly like prepare_release.sh does.
#   5. Package a source tarball with git-archive-all and publish a GitHub
#      release with it attached.
#
# Requires (repo settings, one-time):
#   - Settings > Actions > General > Workflow permissions: "Read and write
#     permissions" (so GITHUB_TOKEN can push the bump commit and create the
#     release).
#   - Branch protection on `main` must allow this push (same as the direct
#     bump-commit pushes done locally today).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options:
          - patch
          - minor
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure running from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be triggered from main (was ${{ github.ref }})"
            exit 1
          fi

      - name: Checkout git repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ubuntu-24.04-ccache-libsession-util-nodejs-release

      - name: Bump version
        id: bump
        run: |
          pnpm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Build libsession-util-nodejs
        run: pnpm install --frozen-lockfile
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Install release tooling (git-archive-all)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt --require-hashes

      - name: Verify version.h matches the release commit
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          GIT_COMMIT=$(git rev-parse HEAD)
          HEADER_PACKAGE_VERSION=$(grep 'LIBSESSION_NODEJS_VERSION' src/version.h | sed -E 's/.*"([0-9.]+)".*/\1/')
          HEADER_GIT_COMMIT=$(grep 'LIBSESSION_NODEJS_COMMIT' src/version.h | sed -E 's/.*"([A-Za-z0-9.]+)".*/\1/')

          echo "Package: $PACKAGE_VERSION; Commit: $GIT_COMMIT"
          if [ "$PACKAGE_VERSION" != "$HEADER_PACKAGE_VERSION" ]; then
              echo "::error::package.json version ($PACKAGE_VERSION) != src/version.h version ($HEADER_PACKAGE_VERSION)"
              exit 1
          fi
          if [ "$GIT_COMMIT" != "$HEADER_GIT_COMMIT" ]; then
              echo "::error::git HEAD ($GIT_COMMIT) != src/version.h commit ($HEADER_GIT_COMMIT)"
              exit 1
          fi

      - name: Build source archive
        run: |
          rm -f ./libsession_util_nodejs*.tar.gz
          .venv/bin/git-archive-all "libsession_util_nodejs-v${{ steps.bump.outputs.version }}.tar.gz" --include src/version.h

          ARCHIVE="libsession_util_nodejs-v${{ steps.bump.outputs.version }}.tar.gz"
          du -sh "$ARCHIVE"

          MAX_BYTES=$((14 * 1024 * 1024))
          ARCHIVE_BYTES=$(stat -c%s "$ARCHIVE")
          if [ "$ARCHIVE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::$ARCHIVE is $(( ARCHIVE_BYTES / 1024 / 1024 ))MiB, which is over the 14MiB limit"
            exit 1
          fi

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            -t "v${{ steps.bump.outputs.version }}" \
            --latest --generate-notes
          gh release upload "v${{ steps.bump.outputs.version }}" \
            "libsession_util_nodejs-v${{ steps.bump.outputs.version }}.tar.gz"

      - name: Summary
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          {
            echo "## Released v${VERSION}"
            echo
            echo "Update session-desktop with:"
            echo '```'
            echo "pnpm remove libsession_util_nodejs"
            echo "pnpm add https://github.com/session-foundation/libsession-util-nodejs/releases/download/v${VERSION}/libsession_util_nodejs-v${VERSION}.tar.gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
